# clang-format and clang-tidy are installed from pinned versions by pre-commit
# itself, so no system clang packages are needed and CI runs the same hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.0
    hooks:
      - id: clang-format
        args: [-i]
        types_or: [c++, c, cuda]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: python
        additional_dependencies: ["clang-tidy==18.1.8"]
        types_or: [c++, c, cuda]
        args:
          - -p=cpp/build
          - --quiet
        files: ^cpp/(src|include)/.*
        exclude: ^cpp/src/apps/
