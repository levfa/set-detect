name: Android test

on:
  push:
    paths:
      - "android/**"
      - "cpp/**"
      - ".github/workflows/android-test.yml"
  pull_request:
    paths:
      - "android/**"
      - "cpp/**"
      - ".github/workflows/android-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies (ninja + cmake for the minimal OpenCV build; git preinstalled)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      # Bootstraps ./gradlew; the actual build/daemon JDK (25) is auto-provisioned by
      # Gradle itself via the foojay-resolver-convention plugin (settings.gradle.kts),
      # per gradle/gradle-daemon-jvm.properties.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # Pinned to a patch tag rather than the floating v4: that ref's history trips
        # act's git resolver ("unsupported object type"), harmless on real GitHub Actions
        # but avoided here since it's just as valid a pin either way.
        uses: gradle/actions/setup-gradle@v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Accepted explicitly below instead: more robust than trusting the action's
          # own internal `sdkmanager --licenses` call to always get a usable stdin.
          accept-android-sdk-licenses: false
          # Default packages ("tools platform-tools") include the legacy "tools" package,
          # which Google discontinued -- sdkmanager can no longer resolve it.
          packages: platform-tools

      - name: Accept SDK licenses, install NDK + the CMake version pinned in build.gradle.kts
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      # The minimal OpenCV build (scripts/build_opencv_min.sh) clones and cross-compiles
      # OpenCV from source -- slow, and its own task already skips rebuilding once this
      # output dir is populated (stamp-file checked), so caching it across runs matters.
      - name: Cache minimal OpenCV build
        uses: actions/cache@v4
        with:
          path: android/app/build/native-sdk-opencv
          key: android-opencv-min-${{ hashFiles('android/scripts/build_opencv_min.sh') }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
