name: Android test

on:
  push:
    paths:
      - "android/**"
      - "cpp/**"
      - "android-publishing/privacy-policy.md"
      - ".github/workflows/android-test.yml"
  pull_request:
    paths:
      - "android/**"
      - "cpp/**"
      - "android-publishing/privacy-policy.md"
      - ".github/workflows/android-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Install system build dependencies (ninja + cmake for the minimal OpenCV build; git preinstalled)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      # Bootstraps ./gradlew; the actual build/daemon JDK (25) is auto-provisioned by
      # Gradle itself via the foojay-resolver-convention plugin (settings.gradle.kts),
      # per gradle/gradle-daemon-jvm.properties.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # Pinned to a patch tag: the floating v4 ref trips act's git resolver locally
        # ("unsupported object type"), though it's harmless on real GitHub Actions.
        # A patch pin works on both. Held to v5, not v6: v6 moves Gradle's caching
        # component behind its own commercial terms of use.
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Accepted explicitly below instead: more robust than trusting the action's
          # own internal `sdkmanager --licenses` call to always get a usable stdin.
          accept-android-sdk-licenses: false
          # Default packages ("tools platform-tools") include the legacy "tools" package,
          # which Google discontinued; sdkmanager can no longer resolve it.
          packages: platform-tools

      - name: Accept SDK licenses, install NDK + the CMake version pinned in build.gradle.kts
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      # The minimal OpenCV build (scripts/build_opencv_min.sh) clones and cross-compiles
      # OpenCV from source, which is slow. It skips rebuilding once this output dir is
      # populated (stamp-file checked), so caching it across runs matters.
      - name: Cache minimal OpenCV build
        uses: actions/cache@v6
        with:
          path: android/app/build/native-sdk-opencv
          key: android-opencv-min-${{ hashFiles('android/scripts/build_opencv_min.sh') }}

      - name: Download inference models
        run: |
          mkdir -p app/src/main/assets/models
          curl -fsSL -o app/src/main/assets/models/card_corners.onnx \
            https://raw.githubusercontent.com/levfa/set-detect-models/main/card-corners/onnx/card_corners.onnx
          curl -fsSL -o app/src/main/assets/models/card_classifier_quant.onnx \
            https://raw.githubusercontent.com/levfa/set-detect-models/main/card-classification/onnx/model_quantized.onnx

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
