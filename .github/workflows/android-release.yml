name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Install system build dependencies (ninja + cmake for the minimal OpenCV build; git preinstalled)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      # Only launches the Gradle wrapper; the actual build JDK is provisioned
      # separately by Gradle's own toolchain resolution.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # Pinned to a patch version: the floating major tag fails to resolve under
        # some local CI runners (e.g. nektos/act). Held to v5, not v6: v6 moves
        # Gradle's caching component behind its own commercial terms of use.
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Licenses are accepted explicitly in a later step instead, since this
          # action's own license-acceptance can fail non-interactively.
          accept-android-sdk-licenses: false
          # Default packages include the legacy "tools" package, discontinued by
          # Google; sdkmanager can no longer resolve it.
          packages: platform-tools

      - name: Accept SDK licenses, install NDK + the CMake version pinned in build.gradle.kts
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      # Caches the from-source OpenCV build, which is slow and otherwise reruns
      # on every job.
      - name: Cache minimal OpenCV build
        uses: actions/cache@v6
        with:
          path: android/app/build/native-sdk-opencv
          key: android-opencv-min-${{ hashFiles('android/scripts/build_opencv_min.sh') }}

      - name: Derive versionName/versionCode from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          echo "SETDETECT_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "SETDETECT_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Decode + validate signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "SETDETECT_RELEASE_KEYSTORE=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"
          echo "decoded keystore: $(wc -c < "$RUNNER_TEMP/signing/release.keystore") bytes, sha256 $(sha256sum "$RUNNER_TEMP/signing/release.keystore" | cut -d' ' -f1)"
          # keytool prints errors to stdout, not stderr, on most JDKs, so output
          # is left unredirected here despite the harmless success lines it adds.
          keytool -list -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/signing/release.keystore" \
            -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS"
          echo "keystore OK, alias '$ANDROID_RELEASE_KEY_ALIAS' found"

      - name: Download inference models
        run: |
          mkdir -p app/src/main/assets/models
          curl -fsSL -o app/src/main/assets/models/card_corners.onnx \
            https://raw.githubusercontent.com/levfa/set-detect-models/main/card-corners/onnx/card_corners.onnx
          curl -fsSL -o app/src/main/assets/models/card_classifier_quant.onnx \
            https://raw.githubusercontent.com/levfa/set-detect-models/main/card-classification/onnx/model_quantized.onnx

      - name: Build signed release APK
        env:
          SETDETECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SETDETECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/release.keystore"

      - name: Rename APK for the release asset
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/set-detect-v${SETDETECT_VERSION_NAME}.apk"

      # Uses gh directly, with its own retry loop, rather than a release-publishing
      # action: GitHub's asset-upload endpoint occasionally leaves a large asset
      # stuck mid-upload, and a same-name upload can't replace a stuck asset without
      # --clobber.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="app/build/outputs/apk/release/set-detect-v${SETDETECT_VERSION_NAME}.apk"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            echo "::warning::Asset upload attempt $attempt failed"
            sleep 20
          done
          echo "::error::Failed to upload release asset after 3 attempts"
          exit 1

  aab-build:
    runs-on: ubuntu-latest
    # Runs after apk-build so this reuses the OpenCV build cache it populates,
    # instead of compiling OpenCV from source twice.
    needs: apk-build
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Install system build dependencies (ninja + cmake for the minimal OpenCV build; git preinstalled)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept SDK licenses, install NDK + the CMake version pinned in build.gradle.kts
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache minimal OpenCV build
        uses: actions/cache@v6
        with:
          path: android/app/build/native-sdk-opencv
          key: android-opencv-min-${{ hashFiles('android/scripts/build_opencv_min.sh') }}

      - name: Derive versionName/versionCode from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          echo "SETDETECT_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "SETDETECT_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Decode + validate signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "SETDETECT_RELEASE_KEYSTORE=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"
          echo "decoded keystore: $(wc -c < "$RUNNER_TEMP/signing/release.keystore") bytes, sha256 $(sha256sum "$RUNNER_TEMP/signing/release.keystore" | cut -d' ' -f1)"
          # keytool prints errors to stdout, not stderr, on most JDKs, so output
          # is left unredirected here despite the harmless success lines it adds.
          keytool -list -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/signing/release.keystore" \
            -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS"
          echo "keystore OK, alias '$ANDROID_RELEASE_KEY_ALIAS' found"

      - name: Download inference models
        run: |
          mkdir -p app/src/main/assets/models
          curl -fsSL -o app/src/main/assets/models/card_corners.onnx \
            https://raw.githubusercontent.com/levfa/set-detect-models/main/card-corners/onnx/card_corners.onnx
          curl -fsSL -o app/src/main/assets/models/card_classifier_quant.onnx \
            https://raw.githubusercontent.com/levfa/set-detect-models/main/card-classification/onnx/model_quantized.onnx

      - name: Build signed release AAB
        env:
          SETDETECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          SETDETECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: ./gradlew bundleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/release.keystore"

      - name: Rename AAB for the artifact
        run: |
          mv app/build/outputs/bundle/release/app-release.aab \
             "app/build/outputs/bundle/release/set-detect-v${SETDETECT_VERSION_NAME}.aab"

      # Uploaded as a workflow artifact only; Play Console publishing stays a
      # manual step for now.
      - name: Upload AAB as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: set-detect-v${{ env.SETDETECT_VERSION_NAME }}-aab
          path: android/app/build/outputs/bundle/release/set-detect-v${{ env.SETDETECT_VERSION_NAME }}.aab
