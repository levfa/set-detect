name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies (ninja + cmake for the minimal OpenCV build; git preinstalled)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      # Bootstraps ./gradlew; the actual build/daemon JDK (25) is auto-provisioned by
      # Gradle itself via the foojay-resolver-convention plugin (settings.gradle.kts),
      # per gradle/gradle-daemon-jvm.properties.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # Pinned to a patch tag rather than the floating v4: that ref's history trips
        # act's git resolver ("unsupported object type"), harmless on real GitHub Actions
        # but avoided here since it's just as valid a pin either way.
        uses: gradle/actions/setup-gradle@v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Accepted explicitly below instead: more robust than trusting the action's
          # own internal `sdkmanager --licenses` call to always get a usable stdin.
          accept-android-sdk-licenses: false
          # Default packages ("tools platform-tools") include the legacy "tools" package,
          # which Google discontinued -- sdkmanager can no longer resolve it.
          packages: platform-tools

      - name: Accept SDK licenses, install NDK + the CMake version pinned in build.gradle.kts
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      # The minimal OpenCV build (scripts/build_opencv_min.sh) clones and cross-compiles
      # OpenCV from source
      - name: Cache minimal OpenCV build
        uses: actions/cache@v4
        with:
          path: android/app/build/native-sdk-opencv
          key: android-opencv-min-${{ hashFiles('android/scripts/build_opencv_min.sh') }}

      - name: Derive versionName/versionCode from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          echo "SETDETECT_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "SETDETECT_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Decode + validate signing keystore
        env:
          ANDROID_GITHUB_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_GITHUB_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_GITHUB_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_GITHUB_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_GITHUB_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_GITHUB_RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_GITHUB_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "SETDETECT_RELEASE_KEYSTORE=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"
          echo "decoded keystore: $(wc -c < "$RUNNER_TEMP/signing/release.keystore") bytes, sha256 $(sha256sum "$RUNNER_TEMP/signing/release.keystore" | cut -d' ' -f1)"
          # No output redirection here: keytool writes its error messages (e.g. "keystore
          # password was incorrect", "alias does not exist") to stdout in most JDK
          # versions, not stderr -- redirecting stdout away would silently hide the one
          # thing this check exists to surface. Its harmless success output (a couple of
          # lines) is an acceptable trade-off for that.
          keytool -list -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/signing/release.keystore" \
            -storepass "$ANDROID_GITHUB_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_GITHUB_RELEASE_KEY_ALIAS"
          echo "keystore OK, alias '$ANDROID_GITHUB_RELEASE_KEY_ALIAS' found"

      - name: Build signed release APK
        env:
          SETDETECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_GITHUB_RELEASE_KEYSTORE_PASSWORD }}
          SETDETECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_GITHUB_RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/release.keystore"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
